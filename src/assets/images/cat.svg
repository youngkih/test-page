<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="65" r="35" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Left ear -->
  <path d="M 75 45 L 65 20 L 85 35 Z" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>
  <path d="M 75 45 L 70 28 L 82 38 Z" fill="#ffccaa"/>

  <!-- Right ear -->
  <path d="M 125 45 L 135 20 L 115 35 Z" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>
  <path d="M 125 45 L 130 28 L 118 38 Z" fill="#ffccaa"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="62" rx="6" ry="10" fill="#333"/>
  <ellipse cx="112" cy="62" rx="6" ry="10" fill="#333"/>
  <circle cx="89" cy="60" r="2" fill="white"/>
  <circle cx="113" cy="60" r="2" fill="white"/>

  <!-- Nose -->
  <path d="M 100 72 L 97 77 L 103 77 Z" fill="#ff6633"/>

  <!-- Mouth -->
  <path d="M 100 77 Q 95 82 90 80" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 100 77 Q 105 82 110 80" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="65" y1="68" x2="85" y2="67" stroke="#333" stroke-width="1"/>
  <line x1="65" y1="73" x2="85" y2="72" stroke="#333" stroke-width="1"/>

  <!-- Whiskers right -->
  <line x1="135" y1="68" x2="115" y2="67" stroke="#333" stroke-width="1"/>
  <line x1="135" y1="73" x2="115" y2="72" stroke="#333" stroke-width="1"/>

  <!-- Left arm -->
  <ellipse cx="70" cy="125" rx="12" ry="30" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Right arm -->
  <ellipse cx="130" cy="125" rx="12" ry="30" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Left leg -->
  <ellipse cx="85" cy="160" rx="12" ry="25" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Right leg -->
  <ellipse cx="115" cy="160" rx="12" ry="25" fill="#ff9966" stroke="#ff6633" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 140 130 Q 170 120 175 95 Q 178 80 170 75" stroke="#ff6633" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Belly spot -->
  <ellipse cx="100" cy="130" rx="25" ry="30" fill="#ffccaa" opacity="0.7"/>
</svg>
