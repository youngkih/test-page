server:
  port: 8080
  # 보안: 웹 화면은 기본적으로 이 컴퓨터(맥미니)에서만 열린다. 폰에서는 텔레그램으로 사용.
  # 같은 와이파이의 다른 기기에서 웹 화면을 열려면 SERVER_ADDRESS=0.0.0.0 으로 실행 (로그인 기능 없음 주의)
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: travel-agent
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 20m

travel-agent:
  model: claude-opus-5
  effort: high
  max-tokens: 64000
  max-web-searches: 15
  max-web-fetches: 20
  max-agent-iterations: 25
  family:
    home-city: 서울
    home-airport: ICN
    language: 한국어
    members:
      - role: 아빠 (사용자)
        age-description: 성인
      - role: 엄마
        age-description: 성인
      - role: 아들
        age-description: 14개월 (걸음마 단계 영아)
        age-years: 1
    notes:
      - 가족 모두 한국인이며 서울에 함께 거주
      - 모든 결정에서 14개월 아들의 컨디션(낮잠, 수유/이유식, 기저귀, 유모차 이동)을 최우선으로 고려

telegram:
  # @BotFather 에서 받은 토큰. 비어 있으면 텔레그램 기능이 꺼진다. 절대 git 에 커밋하지 말 것
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  # 응답할 본인의 텔레그램 사용자 ID (숫자). 비어 있으면 "설정 모드"로 ID 만 알려준다
  allowed-user-id: ${TELEGRAM_ALLOWED_USER_ID:}
  poll-timeout-seconds: 30
